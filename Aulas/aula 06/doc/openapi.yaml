components:
  schemas:
    Ator:
      required:
        - nome
        - data_nascimento
        - id_sexo_ator
        - id_nacionalidade_ator
      type: object
      properties:
        nome:
          type: string
          description: O número máximo de caracteres é de 100
        data_nascimento:
          type: string
          format: date
          example: 1982-06-16
        biografia:
          type: string
          description: O número máximo de caracteres é ilimitado
        id_sexo_ator:
          type: integer
          example: 1
        id_nacionalidade_ator:
          type: integer
          example: 1
    
    Diretor:
      required:
        - nome
        - data_nascimento
        - id_sexo_diretor
        - id_nacionalidade_diretor
      type: object
      properties:
        nome:
          type: string
          description: O número máximo de caracteres é de 100
        data_nascimento:
          type: string
          format: date
          example: 1990-04-16
        biografia:
          type: string
          description: O número máximo de caracteres é ilimitado
        id_sexo_diretor:
          type: integer
          example: 1
        id_nacionalidade_diretor:
          type: integer
          example: 1
        
    Filme:
      required:
        - nome
        - sinopse
        - capa
        - data_lancamento
        - duracao
      type: object
      properties:
        nome:
          type: string
          description: O número máximo de caracteres é de 80
        sinopse:
          type: string
          description: O número máximo de caracteres é ilimitado
        capa:
          type: string
          description: O número máximo de caracteres é 255
        data_lancamento:
          type: string
          format: date
          example: "2026-01-01"
        duracao:
          type: string
          example: "01:30:00"
          pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        valor:
          type: number
          format: double
          example: "99.99"
          description: O número máximo de caracteres é 999 e duas casas decimais (.99)
        avaliacao:
          type: number
          format: double
          example: "5.0"
          description: O número máximo de caracteres é 5 e uma casa decimal (.9), com o máximo de 5.0
    
    Genero:
      required:
        - genero
      type: object
      properties:
        genero:
          type: string
          description: O número máximo de caracteres é de 30
    
    Classificacao:
      required:
        - classificacao
      type: object
      properties:
        classificacao:
          type: string
          description: O número máximo de caracteres é de 6
    
    Sexo:
      required:
        - sexo
        - sigla
      type: object
      properties:
        sexo:
          type: string
          description: O número máximo de caracteres é de 20
        sigla:
          type: string
          description: O número máximo de caracteres é de 3
    
    Nacionalidade:
      required:
        - nacionalidade
        - sigla
      type: object
      properties:
        nacionalidade:
          type: string
          description: O número máximo de caracteres é de 90
        sigla:
          type: string
